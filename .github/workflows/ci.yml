name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        include:
          # The middle versions only need one platform to stay honest.
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The core has no dependencies, and the suite is stdlib-only. Running it
      # against a bare interpreter is the check that keeps it that way.
      - name: Test with no dependencies installed
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src

      - name: Install with the serial extra
        run: python -m pip install -e ".[serial]"

      - name: Test with pyserial present
        run: python -m unittest discover -s tests -v

      - name: Smoke-test the CLI
        shell: bash
        run: |
          termscope --version
          termscope --list || true   # no ports on a runner; must not crash
          termscope --demo --once 2 --color none --charset ascii
          termscope --replay examples/balancing-robot.csv --once 2 --color none

  readme:
    name: README is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Every plot in the README is rendered by the tool. This fails if a
      # rendering change landed without regenerating them.
      - run: python docs/build_readme.py --check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff
      - run: ruff check src tests docs
      - run: ruff format --check src tests docs

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
